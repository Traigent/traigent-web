    <!--
      Content-Security-Policy. connect-src includes a PLACEHOLDER for the
      TraigentBackend host that serves the lead funnel (POST /api/v1/leads +
      /api/v1/leads/verify) — Marketing front door unit A2.

      DEPLOY PREREQUISITE: replace https://BACKEND-HOST-PLACEHOLDER.traigent.ai
      below with the real prod backend origin. The host is env-configured on the
      backend, not hardcoded — the owner / IaC knows it (likely portal.traigent.ai
      or an api.* host; DO NOT guess). The SAME host must be set as
      VITE_API_BASE_URL at build time (see .env.example), and the backend's
      CORS_ORIGINS must allow https://traigent.ai + https://www.traigent.ai.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://forms.hubspot.com https://*.hsforms.com https://*.hsforms.net; script-src 'self' https://www.googletagmanager.com https://*.clarity.ms https://*.hs-scripts.com https://*.hs-analytics.net https://*.hs-banner.com https://*.hscollectedforms.net https://*.hubspot.com https://*.hsforms.net https://*.hsforms.com https://*.hubapi.com https://*.usemessages.com https://*.hs-static.net https://*.hs-static.com https://*.hsadspixel.net https://*.posthog.com; script-src-attr 'none'; worker-src 'self' blob: data: https://*.usemessages.com https://*.hubspot.com; child-src 'self' blob: https://*.hubspot.com https://*.usemessages.com https://*.hsforms.com; style-src 'self' 'unsafe-inline' https://*.hubspot.com https://*.usemessages.com https://*.hsforms.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: data: https://*.hubspot.com https://*.usemessages.com; font-src 'self' data: https://fonts.gstatic.com https://*.hubspot.com https://*.usemessages.com https://*.hsforms.com; connect-src 'self' https://otp.traigent.ai https://BACKEND-HOST-PLACEHOLDER.traigent.ai https://www.google-analytics.com https://*.google-analytics.com https://*.clarity.ms https://*.hubspot.com https://*.hs-analytics.net https://*.hs-banner.com https://*.hscollectedforms.net https://*.hsforms.com https://*.hubapi.com https://*.usemessages.com https://*.hs-static.net https://*.hs-static.com https://*.hsadspixel.net wss://*.hubspot.com wss://*.usemessages.com https://*.posthog.com; frame-src 'self' https://*.hubspot.com https://*.usemessages.com https://*.hsforms.com; manifest-src 'self'; upgrade-insecure-requests" />
