name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint --if-present || echo "No lint script configured"

      - name: Check formatting with Prettier
        run: npm run format:check || echo "Formatting check completed"

      - name: Check CSP guard formatting
        run: npm run format:csp:check

      - name: Build check
        env:
          # Exercise the non-dormant guard path in PR CI. This value is used only
          # in the throwaway CI bundle and is already admitted by the meta CSP.
          FUNNEL_REQUIRED: "1"
          VITE_API_BASE_URL: https://otp.traigent.ai
        run: npm run build

      - name: Summary
        run: echo "✅ Code quality checks completed"
